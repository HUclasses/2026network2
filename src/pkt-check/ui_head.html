<title>pkt セルフチェック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>
<style>
/* 講義教材デザインシステム（単一のライトテーマ）に合わせる。紙の地、罫線で区切る、色は意味に使う */
:root {
  color-scheme: light;
  --paper: #f7f5f0; --surface: #ffffff; --surface-sunk: #efebe3; --line: #d6d0c4;
  --ink: #1f2430; --ink-muted: #555b68; --navy: #1e3a5f; --navy-tint: #e4eaf2;
  --vermilion: #a8402a; --moss: #456334; --vermilion-tint: #f6e7e2; --moss-tint: #e7ede1;
  --serif: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "JetBrains Mono", "BIZ UDGothic", Consolas, monospace;
  --s2: 8px; --s4: 16px; --s6: 24px; --s10: 40px; --r-sm: 2px; --r-md: 6px; --r-lg: 12px;
}
html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.band { height: var(--s2); background: var(--navy); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--s6) var(--s10); display: grid; gap: var(--s6); }
header { display: grid; gap: var(--s2); }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--ink-muted); }
h1 { font-family: var(--serif); font-size: clamp(28px, 5vw, 36px); line-height: 1.35; color: var(--navy); margin: 0; text-wrap: balance; }
h2 { font-family: var(--serif); font-size: 20px; line-height: 1.6; margin: 0; color: var(--ink); text-wrap: balance; }
.lead { margin: 0; max-width: 42em; }
/* 日本語の改行：文節で折り返し、行末に1〜2文字だけ残さない */
.lead, .lead small, .note, .item p, .sub, .foot, .notice, .err, .allgood { word-break: auto-phrase; text-wrap: pretty; line-break: strict; }
.kp { word-break: keep-all; overflow-wrap: anywhere; }
.nw { white-space: nowrap; }
.lead small { display: block; color: var(--ink-muted); font-size: 13px; line-height: 1.6; margin-top: var(--s2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s6); display: grid; gap: var(--s4); }
.controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4) var(--s6); }
@media (max-width: 640px) { .controls { grid-template-columns: minmax(0, 1fr); } .panel { padding: var(--s4); } }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: 14px; }
.field .note { font-size: 13px; color: var(--ink-muted); line-height: 1.6; }
.seg { display: flex; flex-wrap: wrap; gap: var(--s2); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 14px; cursor: pointer; background: var(--surface); font-size: 14px; }
.seg input:checked + label { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg input:focus-visible + label { outline: 2px solid var(--navy); outline-offset: 2px; }
input[type=text] { font: 15px var(--mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); width: 100%; max-width: 16em; box-sizing: border-box; }
input[type=text]:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
.drop { grid-column: 1 / -1; border: 1.5px dashed var(--ink-muted); border-radius: var(--r-md); background: var(--surface-sunk); padding: var(--s6) var(--s4); text-align: center; cursor: pointer; display: grid; gap: 4px; justify-items: center; }
.drop:hover, .drop.over { border-color: var(--navy); background: var(--navy-tint); }
.drop:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.drop strong { font-size: 16px; color: var(--navy); }
.drop span { font-size: 13px; color: var(--ink-muted); }
.btn { font: 700 14px var(--sans); border: 1px solid var(--navy); color: var(--navy); background: var(--surface); border-radius: var(--r-md); padding: 6px 14px; cursor: pointer; }
.btn:hover { background: var(--navy-tint); }
.btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); padding: var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.status .file { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); overflow-wrap: anywhere; min-width: 0; }
.verdict { font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--moss); } .verdict.ng { color: var(--vermilion); }
.example-tag { font-size: 12px; letter-spacing: .06em; border: 1px solid var(--ink-muted); color: var(--ink-muted); border-radius: var(--r-sm); padding: 0 6px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px var(--s4); padding: var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.badge { font-size: 12px; font-weight: 700; letter-spacing: .04em; border-radius: var(--r-sm); padding: 2px 8px; align-self: start; white-space: nowrap; }
.badge.fix { background: var(--vermilion-tint); color: var(--vermilion); }
.badge.check { background: var(--navy-tint); color: var(--navy); }
.badge.info { background: var(--surface-sunk); color: var(--ink-muted); }
.item .who { font-weight: 700; margin-right: .5em; }
.item p { margin: 0; min-width: 0; }
.item .hint { grid-column: 2; font-size: 14px; color: var(--ink); line-height: 1.7; }
.item .hint b { color: var(--moss); font-size: 12px; letter-spacing: .06em; margin-right: .5em; }
@media (max-width: 480px) { .item { grid-template-columns: minmax(0, 1fr); } .item .hint { grid-column: 1; } }
.allgood { padding: var(--s4); border-radius: var(--r-md); background: var(--moss-tint); color: var(--ink); }
.allgood b { color: var(--moss); }
section { display: grid; gap: var(--s4); min-width: 0; }
.sub { font-size: 13px; color: var(--ink-muted); margin: 0; line-height: 1.6; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; white-space: nowrap; }
th { background: var(--surface-sunk); font-weight: 700; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.mono, .mono { font-family: var(--mono); font-size: 13px; }
.addr .net { color: #7a7f8a; } .addr .host { color: var(--moss); font-weight: 600; }
.ok { color: var(--moss); font-weight: 700; } .ng { color: var(--vermilion); font-weight: 700; }
.mx td, .mx th { text-align: center; min-width: 3.2em; }
.mx th[scope=row] { text-align: left; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s6); }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.foot { font-size: 13px; color: var(--ink-muted); border-top: 1px solid var(--line); padding-top: var(--s4); line-height: 1.7; }
.notice { padding: 10px var(--s4); border-radius: var(--r-md); background: var(--navy-tint); color: var(--ink); font-size: 14px; }
.err { padding: var(--s4); border-radius: var(--r-md); background: var(--vermilion-tint); color: var(--ink); }
.err b { color: var(--vermilion); }
@media (prefers-reduced-motion: no-preference) { .result { animation: fade .25s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>
